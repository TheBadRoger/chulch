[package]
name = "mcdocker"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
